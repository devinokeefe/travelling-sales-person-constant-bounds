# Lint and format settings for the Python files:  ruff check .  and  ruff format .
line-length = 110
target-version = "py310"
extend-exclude = ["lean"]  # the scripts in lean/runs/ belong to the Lean development and have their own style

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PL"]
ignore = [
    "PLR2004",  # numeric constants in comparisons
    "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # size limits on functions
    "SIM108",   # if-else blocks are not forced into one line
]

[lint.isort]
known-first-party = ["bracket", "check_bound", "simulate"]
